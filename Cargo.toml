[package]
name = "pigeon-cli"
version = "0.4.2"
edition = "2024"
rust-version = "1.92"
description = "Pigeon: authenticate, sink, and transform personal data from external services."
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon-cli"
readme = "README.md"
keywords = ["email", "imap", "s3", "backup", "cli"]
categories = ["command-line-utilities", "email"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md", "CHANGELOG.md"]

[lib]
name = "pigeon"
path = "src/lib.rs"

[[bin]]
name = "pigeon"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
aes-gcm-siv = "0.11"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
bytes = "1.12.1"
clap = { version = "4", features = ["derive", "cargo"] }
dialoguer = "0.12.0"
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
htmd = "0.5.5"
indicatif = "0.18.6"
kamadak-exif = "0.6.1"
keyring = "4.2.0"
lopdf = "0.45.0"
mail-parser = "0.11.9"
md5 = "0.8.1"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
minio = "0.4.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "process"] }
toml = "1.1.6"
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1", "linux-keyutils-keyring-store"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
