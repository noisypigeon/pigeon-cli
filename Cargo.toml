[package]
name = "pigeon-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Pigeon: authenticate, sink, and transform personal data from external services."
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon-cli"
readme = "README.md"
keywords = ["email", "imap", "s3", "backup", "cli"]
categories = ["command-line-utilities", "email"]

[lib]
name = "pigeon"
path = "service/pigeon-cli/src/lib.rs"

[[bin]]
name = "pigeon"
path = "service/pigeon-cli/src/main.rs"

[[test]]
name = "cli"
path = "service/pigeon-cli/tests/cli.rs"

[dependencies]
aes-gcm-siv = "0.11"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
bytes = "1.12.1"
clap = { version = "4", features = ["derive", "cargo"] }
dialoguer = "0.12.0"
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
htmd = "0.5.5"
indicatif = "0.18.6"
keyring = "4.2.0"
mail-parser = "0.11.9"
md5 = "0.8.1"
minio = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
