[package]
name = "pigeon-cli"
version = "0.4.27"
edition = "2024"
rust-version = "1.92"
description = "Pigeon: authenticate, sink, and transform personal data from external services."
license = "GPL-3.0-or-later"
repository = "https://github.com/noisypigeon/pigeon-cli"
readme = "README.md"
keywords = ["email", "imap", "s3", "backup", "cli"]
categories = ["command-line-utilities", "email"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md", "CHANGELOG.md"]

[lib]
name = "pigeon"
path = "src/lib.rs"

[[bin]]
name = "pigeon"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6.0", default-features = false, features = ["runtime-tokio"] }
clap = { version = "4", features = ["derive", "cargo"] }
dialoguer = "0.12.0"
directories = "6.0.0"
futures = "0.3.34"
hex = "0.4"
indicatif = "0.18.6"
mail-parser = "0.11.9"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
time = "0.3"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "net", "macros", "time", "process"] }
toml = "1.1.6"
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
# `test-util` gives `#[tokio::test(start_paused = true)]` a virtual clock, so
# ADR-0144's `EndpointGate` tests assert its election and round accounting
# without actually sleeping out the recovery backoff. Dev-only: nothing in the
# shipped binary may depend on a pausable clock.
tokio = { version = "1.53.1", features = ["test-util"] }
