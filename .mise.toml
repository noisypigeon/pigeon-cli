[tools]
rust = "1.92.0"

# Library assets this repo consumes by version (CLI-0161, LIB-0001 invariant 2).
# The scripts' version is /.lib-version, read by fetch-lib.sh; the stack's tag
# is pinned here, and the Claude Code plugin's in .claude/settings.json.
[env]
PIGEON_OBSERVABILITY_VERSION = "observability/pigeon-cli/v1.0.0"

# Materializes the library into .lib-src/ at /.lib-version. A no-op beyond a
# tag fetch once it is there; set LIB_SRC to use your own checkout instead.
[tasks.fetch-lib]
run = "./fetch-lib.sh"

[tasks.build]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
"""

[tasks.pigeon]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
exec target/debug/pigeon "$@"
"""

[tasks.build-release]
depends = ["fetch-lib"]
run = "\"${LIB_SRC:-.lib-src}/lib/scripts/crate-build-release.sh\" --bin pigeon --codesign-id dev.pigeon.cli \"$@\""

[tasks.pigeon-release]
run = """
cargo build --release
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/release/pigeon
fi
exec target/release/pigeon "$@"
"""

[tasks.test]
run = "cargo test"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.ci]
depends = ["fmt-check", "lint", "test"]

[tasks.publish-dry-run]
run = "cargo publish --dry-run"

[tasks.publish]
run = "cargo publish"

[tasks.release]
depends = ["fetch-lib"]
run = "\"${LIB_SRC:-.lib-src}/lib/scripts/crate-release.sh\" --crate pigeon-cli \"$@\""

[tasks.adr-issue]
depends = ["fetch-lib"]
run = "\"${LIB_SRC:-.lib-src}/lib/scripts/adr-issue.sh\" --repo noisypigeon/pigeon-cli --label-meta .github/adr-issue-labels.txt \"$@\""

# CLI-0163: for the host's own architecture. Releases publish arm64 and amd64
# to GHCR through the library's container-image-release.yml; docker-pull
# fetches that instead of building.
[tasks.docker-build]
run = "docker build -t pigeon-cli ."

[tasks.docker-pull]
run = "docker pull ghcr.io/noisypigeon/pigeon-cli:${1:-latest} && docker tag ghcr.io/noisypigeon/pigeon-cli:${1:-latest} pigeon-cli"

[tasks.docker-run]
run = "docker run --rm -it -v pigeon-data:/data pigeon-cli \"$@\""

# The local observability stack (CLI-0128) lives in the library since CLI-0161.
# observability-stack extracts the pinned tag's stack, and the dashboard it
# mounts, out of .lib-src/ into .lib-observability/, replacing any older copy.
# The tag holds them under lib/ (LIB-0047); stripping it keeps the layout the
# compose file's relative mounts expect.
[tasks.observability-stack]
depends = ["fetch-lib"]
run = """
rm -rf .lib-observability
mkdir -p .lib-observability
git -C "${LIB_SRC:-.lib-src}" archive "$PIGEON_OBSERVABILITY_VERSION" lib/observability/pigeon-cli lib/grafana-dashboards/pigeon-cli \
  | tar -x --strip-components=1 -C .lib-observability
"""

[tasks.observability-up]
depends = ["observability-stack"]
run = "docker compose -f .lib-observability/observability/pigeon-cli/docker-compose.yml up -d"

# By project name (pinned to `observability` in the stack), so these work
# whether or not .lib-observability/ is still there.
[tasks.observability-down]
run = "docker compose -p observability down"

[tasks.observability-logs]
run = "docker compose -p observability logs -f \"$@\""
