[tools]
rust = "1.92.0"

[tasks.build]
run = "cargo build"

[tasks.test]
run = "cargo test"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.ci]
depends = ["fmt-check", "lint", "test"]
