[tools]
rust = "1.92.0"

[tasks.build]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
"""

[tasks.pigeon]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
exec target/debug/pigeon "$@"
"""

[tasks.test]
run = "cargo test"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.ci]
depends = ["fmt-check", "lint", "test"]

[tasks.publish-dry-run]
run = "cargo publish --dry-run"

[tasks.publish]
run = "cargo publish"
