[tools]
rust = "1.92.0"

[tasks.build]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
"""

[tasks.pigeon]
run = """
cargo build
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/debug/pigeon
fi
exec target/debug/pigeon "$@"
"""

[tasks.build-release]
run = """
cargo build --release
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/release/pigeon
fi
"""

[tasks.pigeon-release]
run = """
cargo build --release
if [ "$(uname)" = "Darwin" ]; then
  codesign --force -s - --identifier "dev.pigeon.cli" target/release/pigeon
fi
exec target/release/pigeon "$@"
"""

[tasks.test]
run = "cargo test"

[tasks.fmt]
run = "cargo fmt --all"

[tasks.fmt-check]
run = "cargo fmt --all -- --check"

[tasks.lint]
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.ci]
depends = ["fmt-check", "lint", "test"]

[tasks.publish-dry-run]
run = "cargo publish --dry-run"

[tasks.publish]
run = "cargo publish"

[tasks.adr-issue]
run = ".github/scripts/adr-issue.sh \"$@\""

[tasks.docker-build]
run = "docker build --platform linux/arm64 -t pigeon-cli ."

[tasks.docker-run]
run = "docker run --platform linux/arm64 --rm -it -v pigeon-data:/data pigeon-cli \"$@\""
