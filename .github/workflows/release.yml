# A thin caller since CLI-0161: the release body -- fmt-check, lint, cut,
# commit+tag+push, publish, GitHub Release, then the per-target binaries --
# lives in the library's rust-crate-release.yml, at the version the `uses:`
# ref below pins. Keep that ref equal to /.lib-version: the workflow runs this
# repo's fetch-lib.sh, which checks out the library at .lib-version for the
# scripts it calls.
#
# This file keeps what cannot live in the library: the trigger, the loop
# guard, permissions and concurrency. Unlike the library's other spokes, this
# repo writes its own vX.Y.Z tags (LIB-0001's 2026-10-19 amendment).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    uses: noisypigeon/library/.github/workflows/rust-crate-release.yml@workflows/v3.3.0
    with:
      crate: pigeon-cli
      bin: pigeon
      codesign_id: dev.pigeon.cli
      targets: |
        [
          { "runner": "macos-14", "triple": "aarch64-apple-darwin", "smoke_test": true },
          { "runner": "ubuntu-24.04-arm", "triple": "aarch64-unknown-linux-gnu", "smoke_test": true },
          { "runner": "macos-14", "triple": "x86_64-apple-darwin", "smoke_test": false },
          { "runner": "ubuntu-24.04", "triple": "x86_64-unknown-linux-gnu", "smoke_test": true }
        ]
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
