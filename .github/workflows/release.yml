# A thin caller since CLI-0161: the release body -- fmt-check, lint, cut,
# commit+tag+push, publish, GitHub Release, then the per-target binaries --
# lives in the library's rust-crate-release.yml, at the version the `uses:`
# ref below pins. Keep that ref equal to /.lib-version: the workflow runs this
# repo's fetch-lib.sh, which checks out the library at .lib-version for the
# scripts it calls.
#
# This file keeps what cannot live in the library: the trigger, the loop
# guard, permissions and concurrency. Unlike the library's other spokes, this
# repo writes its own vX.Y.Z tags (LIB-0001's 2026-10-19 amendment).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    uses: noisypigeon/library/.github/workflows/rust-crate-release.yml@workflows/v3.4.0
    with:
      crate: pigeon-cli
      bin: pigeon
      codesign_id: dev.pigeon.cli
      targets: |
        [
          { "runner": "macos-14", "triple": "aarch64-apple-darwin", "smoke_test": true },
          { "runner": "ubuntu-24.04-arm", "triple": "aarch64-unknown-linux-gnu", "smoke_test": true },
          { "runner": "macos-14", "triple": "x86_64-apple-darwin", "smoke_test": false },
          { "runner": "ubuntu-24.04", "triple": "x86_64-unknown-linux-gnu", "smoke_test": true }
        ]
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # CLI-0163: the released tag's image, for arm64 and amd64, to
  # ghcr.io/noisypigeon/pigeon-cli. The smoke test runs inside each
  # platform's image before anything is pushed: one line per binary a job
  # shells out to, so an image missing any of them never publishes.
  image:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: noisypigeon/library/.github/workflows/container-image-release.yml@workflows/v3.4.0
    with:
      version: ${{ needs.release.outputs.version }}
      image: ghcr.io/noisypigeon/pigeon-cli
      smoke_test: |
        pigeon --version
        rclone version
        ffmpeg -hide_banner -version
        ffprobe -hide_banner -version
        ffprobe -hide_banner -h 2>&1 | grep -q show_stream_groups
        soffice --version
        ebook-convert --version
        pandoc --version
        gs --version
