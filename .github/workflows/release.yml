name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - name: Install rustfmt/clippy components
        run: rustup component add rustfmt clippy

      - name: Configure release commit identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: mise run fmt-check
      - run: mise run lint

      - name: Cut release and publish
        id: release
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          output="$(mise run release)"
          echo "$output"
          new_version="$(echo "$output" | tail -1 | sed 's/^NEW_VERSION=//')"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.release.outputs.version }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --notes "See CHANGELOG.md for details."

  build-binaries:
    needs: release
    strategy:
      matrix:
        include:
          - runner: macos-14
            triple: aarch64-apple-darwin
            smoke_test: true
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            smoke_test: true
          - runner: macos-14
            triple: x86_64-apple-darwin
            smoke_test: false
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            smoke_test: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_version }}

      - uses: jdx/mise-action@v2

      - run: mise run build-release -- --target ${{ matrix.triple }}

      - name: Smoke test
        if: matrix.smoke_test
        run: target/${{ matrix.triple }}/release/pigeon --version

      - name: Package binary
        run: |
          version="${{ needs.release.outputs.new_version }}"
          triple="${{ matrix.triple }}"
          tar czf "pigeon-v${version}-${triple}.tar.gz" -C "target/${triple}/release" pigeon -C "$GITHUB_WORKSPACE" LICENSE.md

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.new_version }}"
          triple="${{ matrix.triple }}"
          gh release upload "v${version}" "pigeon-v${version}-${triple}.tar.gz"
