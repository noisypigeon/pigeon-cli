server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pigeon_cli
    static_configs:
      - targets: [localhost]
        labels:
          __path__: /var/log/pigeon/pigeon.jsonl
    pipeline_stages:
      # Mirrors noisypigeon's cloud-side Alloy `stage.json`/`stage.timestamp`/
      # `stage.labels` pipeline almost 1:1 (ADR-0093's JSONL schema). The one
      # auto-emitted span-close event per run has an empty `spans[]`, so this
      # extraction fails for that single line -- it still gets ingested, just
      # without the pigeon_job/instance labels below.
      - json:
          expressions:
            ts: timestamp
            pigeon_job: spans[0].command
            instance: spans[0].instance
      - timestamp:
          source: ts
          format: RFC3339Nano
      - labels:
          pigeon_job:
          instance:
